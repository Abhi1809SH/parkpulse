name: Validate ParkPulse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check application JavaScript syntax
        run: |
          cp app.js /tmp/parkpulse-app.mjs
          node --check /tmp/parkpulse-app.mjs

      - name: Check parking location syntax
        run: node --check parking-location.js

      - name: Check location control syntax
        run: node --check location-control.js

      - name: Check notification control syntax
        run: node --check notification-control.js

      - name: Check update control syntax
        run: node --check update-control.js

      - name: Check service worker syntax
        run: node --check sw.js

      - name: Validate PWA manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest JSON valid')"

      - name: Test persistent location permission toggle
        run: node scripts/test-location-control.mjs

      - name: Test strict parking geolocation
        run: node scripts/test-parking-location.mjs

      - name: Test automatic update flow
        run: node scripts/test-update-control.mjs

      - name: Run ParkPulse static checks
        run: node scripts/validate-static.mjs
