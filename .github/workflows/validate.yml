name: Validate ParkPulse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check application JavaScript syntax
        run: |
          cp app.js /tmp/parkpulse-app.mjs
          node --check /tmp/parkpulse-app.mjs

      - name: Check service worker syntax
        run: node --check sw.js

      - name: Run ParkPulse static checks
        run: node scripts/validate-static.mjs
