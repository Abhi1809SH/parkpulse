name: Build Android widget

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build signed debug APK without external dependencies
        working-directory: native/android
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          rm -rf build
          mkdir -p build/generated build/classes build/dex

          "$BT/aapt2" compile --dir app/src/main/res -o build/resources.zip
          "$BT/aapt2" link \
            -o build/base.apk \
            -I "$ANDROID_JAR" \
            --manifest app/src/main/AndroidManifest.xml \
            --java build/generated \
            --min-sdk-version 26 \
            --target-sdk-version 35 \
            build/resources.zip

          find app/src/main/java build/generated -name '*.java' -print0 | \
            xargs -0 javac -source 8 -target 8 -cp "$ANDROID_JAR" -d build/classes

          jar cf build/classes.jar -C build/classes .
          "$BT/d8" --lib "$ANDROID_JAR" --min-api 26 --output build/dex build/classes.jar

          cp build/base.apk build/app-debug-unsigned.apk
          (cd build/dex && zip -q -u ../app-debug-unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 build/app-debug-unsigned.apk build/app-debug-aligned.apk

          keytool -genkeypair -noprompt \
            -keystore build/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=ParkPulse,C=AU" \
            -keyalg RSA -keysize 2048 -validity 10000

          "$BT/apksigner" sign \
            --ks build/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/ParkPulse-debug.apk \
            build/app-debug-aligned.apk

          "$BT/apksigner" verify --verbose build/ParkPulse-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parkpulse-android-debug
          path: native/android/build/ParkPulse-debug.apk
